version: "2"
run:
  build-tags:
    - e2e

linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - gosec
    - govet
    - staticcheck
    - unused

  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - (io.Writer).Write
        - fmt.Fprintln
        - fmt.Fprintf
        - (io.Closer).Close
    staticcheck:
      checks:
        - "all"
        - "-QF*"
        - "-ST1000"

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: github.com/eudi-dev/ebw-dev
