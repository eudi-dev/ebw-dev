- identifier:
    - identifier: DETEST.00000471
  tradeName: Acme Logistics
  legalPerson:
    legalName: ["Acme Logistics GmbH"]
  country: DE
  services:
    - serviceIdentifier: agent-service
      serviceTradeName: Acme agent service
      intendedUses:
        - intendedUseIdentifier: supplier-mandate
          purpose:
            - lang: en
              content: Give the procurement agent a delegation for orders at suppliers
          credentials:
            - format: dc+sd-jwt
              meta:
                vct_values: ["uri:eu.eudi.eu-poa.1"]
              claims:
                - path: [euid_reference]
                - path: [company_statutory_full_name]
                - path: [attorney_full_name]
                - path: [scope_of_representation_powers]
                - path: [validity_period_valid_until]
        - intendedUseIdentifier: internal-mandate
          purpose:
            - lang: en
              content: Give the procurement agent a delegation to approve invoices
          credentials:
            - format: dc+sd-jwt
              meta:
                vct_values: ["urn:eudi-test:business:employee-authorisation:1"]
              claims:
                - path: [represented_economic_operator]
                - path: [proxy]
                - path: [authority]
    - serviceIdentifier: employee-authorisations
      serviceTradeName: Acme employee authorisations
      providesAttestations:
        - format: dc+sd-jwt
          type: urn:eudi-test:business:employee-authorisation:1
