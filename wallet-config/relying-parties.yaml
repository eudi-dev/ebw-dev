- identifier:
    - identifier: SETEST.00000474
  tradeName: Example Bank
  legalPerson:
    legalName: ["Example Bank AB"]
  country: SE
  services:
    - serviceIdentifier: business-onboarding
      serviceTradeName: Example Bank business onboarding
      intendedUses:
        - intendedUseIdentifier: know-your-business
          purpose:
            - lang: en
              content: Identify a company and its representative before opening a business account
          credentials:
            - format: dc+sd-jwt
              meta:
                vct_values: ["uri:eu.ebw.oid.1"]
              claims:
                - path: [id]
                - path: [name]
                - path: [issuing_authority]
                - path: [issuing_country]
                - path: [date_of_expiry]
            - format: dc+sd-jwt
              meta:
                vct_values: ["uri:eu.eudi.eu-poa.1"]
              claims:
                - path: [euid_reference]
                - path: [company_statutory_full_name]
                - path: [attorney_full_name]
                - path: [scope_of_representation_powers]
                - path: [validity_period_valid_from]
                - path: [validity_period_valid_until]
